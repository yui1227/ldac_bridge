name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # create releases for v* tags

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            patch
            zip

      - name: Fetch BTstack, libldac and firmware
        run: sh setup.sh

      - name: Build
        run: sh ldac_bridge/build.sh all offline_test.exe

      - name: Package
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then version="${GITHUB_REF_NAME}"; else version="${GITHUB_SHA:0:7}"; fi
          pkg=ldac_bridge-${version}-win64
          mkdir -p "$pkg/firmware" "$pkg/licenses"
          cp ldac_bridge/ldac_bridge.exe ldac_bridge/ldac_tray.exe ldac_bridge/offline_test.exe "$pkg/"
          cp ldac_bridge/firmware/* "$pkg/firmware/"
          cp README.md README.zh-TW.md LICENSE THIRD_PARTY_NOTICES.md "$pkg/"
          cp third_party/btstack/LICENSE "$pkg/licenses/BTSTACK_LICENSE.txt"
          cp third_party/libldac/LICENSE "$pkg/licenses/LIBLDAC_LICENSE.txt"
          cp third_party/libldac/NOTICE "$pkg/licenses/LIBLDAC_NOTICE.txt"
          zip -r "$pkg.zip" "$pkg"
          echo "PKG=$pkg" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: ${{ env.PKG }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PKG }}.zip
          generate_release_notes: true
